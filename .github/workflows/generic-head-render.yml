name: Generic whole-character Einar56 browser proof
on:
  push:
    branches: [main]
    paths: ['.github/workflows/generic-head-render.yml']
permissions:
  contents: read
jobs:
  whole-character:
    if: github.event.repository.private == false && github.event.head_commit.message == 'Complete generic Einar56 sampled motion'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            package46
            package55
            package56
      - name: Install exact browser test runtime
        working-directory: package56
        run: |
          npm install --ignore-scripts --no-audit --no-fund --save-exact playwright-core@1.57.0
          npx --no-install playwright-core install chromium
      - name: Remaining sampled poses with exact cross-run overlap
        working-directory: package56
        run: timeout 480s node capture56-tail.cjs
