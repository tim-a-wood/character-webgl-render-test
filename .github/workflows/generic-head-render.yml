# Observe frame transport terminal events without changing runtime or failure checks.
name: Generic Einar68 bounded transport diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/generic-head-render.yml']
permissions:
  contents: read
jobs:
  native-geometry:
    if: github.event.repository.private == false && github.event.head_commit.message == 'Render generic Einar68 pilot proof'
    strategy:
      fail-fast: false
      matrix:
        segment: [a]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            package46
            package55
            package56
            package68
      - name: Install exact browser test runtime
        working-directory: package68
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.57.0
          npx --no-install playwright-core install chromium
      - name: Observe three verified frame downloads and one exact native pose
        working-directory: package68
        env:
          CAPTURE_SEGMENT: ${{ matrix.segment }}
        run: timeout 600s node transport-probe68.cjs
