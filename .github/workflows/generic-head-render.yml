name: Generic Einar68 bounded playback and transport proof
on:
  push:
    branches: [main]
    paths: ['.github/workflows/generic-head-render.yml']
permissions:
  contents: read
jobs:
  native-geometry:
    if: github.event.repository.private == false && github.event.head_commit.message == 'Check generic Einar68 playback and transport fix'
    strategy:
      fail-fast: false
      matrix:
        segment: [transport, playback]
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            package46
            package55
            package56
            package68
      - name: Install exact browser test runtime
        working-directory: package68
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.57.0
          npx --no-install playwright-core install chromium
      - name: Bounded full-manifest playback or transport check
        working-directory: package68
        env:
          CAPTURE_SEGMENT: ${{ matrix.segment }}
          SMOKE_CACHE_CONTROL68: no-cache
        run: |
          if [ "$CAPTURE_SEGMENT" = transport ]; then
            timeout 600s node transport-matrix68.cjs
          else
            timeout 600s node playback-smoke68.cjs
          fi
