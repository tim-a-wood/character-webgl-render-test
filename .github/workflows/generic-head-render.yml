name: Generic character finite Jog WIP proof76
on:
  push:
    branches: [main]
    paths: ['.github/workflows/generic-head-render.yml', 'package72/**']
permissions:
  contents: read
jobs:
  standard-character:
    if: github.event.repository.private == false && github.event.head_commit.message == 'Check generic whole-character mobile port72'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            package72
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Install pinned validator and browser harness
        working-directory: package72
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore and verify exact standard runtime
        working-directory: package72
        run: node restore-transport72.cjs && node validate72.cjs && npm test && node freeze72.cjs && node restore-transport76.cjs && node validate76.cjs
      - name: Install established Chromium
        working-directory: package72
        run: npx --no-install playwright-core install chromium
      - name: Finite Jog WIP playback and gait captures
        working-directory: package72
        run: timeout 420s node capture76-jog.cjs
