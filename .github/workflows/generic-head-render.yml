name: Generic whole-character Einar60 browser proof
on:
  push:
    branches: [main]
    paths: ['.github/workflows/generic-head-render.yml']
permissions:
  contents: read
jobs:
  whole-character:
    if: github.event.repository.private == false && github.event.head_commit.message == 'Render generic Einar60 upright walk'
    strategy:
      fail-fast: false
      matrix:
        segment: [a, b]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            package46
            package55
            package57
            package60
      - name: Install exact browser test runtime
        working-directory: package60
        run: |
          npm install --ignore-scripts --no-audit --no-fund --save-exact playwright-core@1.57.0
          npx --no-install playwright-core install chromium
      - name: Bounded upright walk segment
        working-directory: package60
        env:
          CAPTURE_SEGMENT: ${{ matrix.segment }}
        run: timeout 480s node capture60-full.cjs
