name: Generic Einar68 full finite native walk proof
on:
  push:
    branches: [main]
    paths: ['.github/workflows/generic-head-render.yml']
permissions:
  contents: read
jobs:
  native-geometry:
    if: github.event.repository.private == false && github.event.head_commit.message == 'Render generic Einar68 full finite walk proof'
    strategy:
      fail-fast: false
      matrix:
        segment: [a, b, c, d]
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            package46
            package55
            package56
            package68
      - name: Install exact browser test runtime
        working-directory: package68
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.57.0
          npx --no-install playwright-core install chromium
      - name: Actual WebGL native geometry and reset proof
        working-directory: package68
        env:
          CAPTURE_SEGMENT: ${{ matrix.segment }}
        run: timeout 1800s node capture68.cjs
