name: Generic support Jog v4 comparison79
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standard-character:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            package72
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Install pinned validator and browser harness
        working-directory: package72
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore exact standard runtime and lossless hosting parts
        working-directory: package72
        run: node restore-transport72.cjs && node restore-transport76.cjs && node restore-transport77.cjs && node restore-transport78.cjs && node restore-transport79.cjs && node split79.cjs && node validate79.cjs
      - name: Install established Chromium
        working-directory: package72
        run: npx --no-install playwright-core install chromium
      - name: Support Jog v3-v4 poses and finite-play smoke
        working-directory: package72
        run: timeout 300s node capture79-jog.cjs
