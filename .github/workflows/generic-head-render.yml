name: Generic representative standard glTF proof71
on:
  push:
    branches: [main]
    paths: ['.github/workflows/generic-head-render.yml', 'package71/**']
permissions:
  contents: read
jobs:
  standard-character:
    if: github.event.repository.private == false && github.event.head_commit.message == 'Check generic representative standard port71'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            package71
      - name: Use exact supported Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Install exact validator and established browser harness
        working-directory: package71
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore the exact exporter GLB from lossless transport
        working-directory: package71
        run: node restore-transport71.cjs
      - name: Validate the exact standard Blender glTF export
        working-directory: package71
        run: node validate-gltf71.cjs representative71.glb validator71.json
      - name: Fetch, verify and build official Khronos Sample Viewer
        working-directory: package71
        run: bash prepare-official-viewer71.sh
      - name: Install established Chromium
        working-directory: package71
        run: npx --no-install playwright-core install chromium
      - name: Small independent standard viewer proof
        working-directory: package71
        run: timeout 300s node capture-standard-viewer71.cjs
